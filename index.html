<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presensi — Scan Kartu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #060a12;
    --bg-2: #0b1220;
    --panel: #0e1626;
    --line: rgba(148, 178, 220, 0.14);
    --line-strong: rgba(148, 178, 220, 0.32);
    --text: #dce6f5;
    --text-dim: #6b7d99;
    --cyan: #4fd8ff;
    --violet: #8a7bff;
    --green: #35e0a1;
    --red: #ff6b7f;
    --amber: #ffbe5c;
    --radius: 4px;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(79,216,255,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 100%, rgba(138,123,255,0.08), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
  }

  /* faint grid texture */
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(148,178,220,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148,178,220,0.045) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse 700px 700px at 50% 30%, black, transparent 75%);
    pointer-events:none;
  }

  .panel{
    position:relative;
    width:100%;
    max-width: 380px;
    background: linear-gradient(180deg, var(--panel), var(--bg-2));
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 36px 30px 30px;
  }

  /* viewfinder corner brackets */
  .panel::before, .panel::after,
  .corner-tl, .corner-br{
    content:"";
    position:absolute;
    width: 18px; height: 18px;
    border-color: var(--cyan);
    border-style: solid;
    opacity:.7;
  }
  .panel::before{ top:-1px; left:-1px; border-width: 2px 0 0 2px; }
  .panel::after{ bottom:-1px; right:-1px; border-width: 0 2px 2px 0; }
  .corner-tl{ top:-1px; right:-1px; border-width: 2px 2px 0 0; }
  .corner-br{ bottom:-1px; left:-1px; border-width: 0 0 2px 2px; }

  .eyebrow{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin-bottom: 18px;
  }
  .dot{
    width:7px; height:7px; border-radius:50%;
    background: var(--amber);
    box-shadow: 0 0 8px var(--amber);
    flex-shrink:0;
  }
  .dot.on{ background: var(--green); box-shadow: 0 0 8px var(--green); }

  h1{
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-bottom: 6px;
  }

  .sub{
    font-size: 14px;
    color: var(--text-dim);
    margin-bottom: 28px;
    line-height: 1.5;
  }

  /* scan trigger */
  .scan-trigger{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 12px;
    background: linear-gradient(100deg, var(--cyan), var(--violet));
    color: #04101c;
    border:none;
    border-radius: var(--radius);
    padding: 15px;
    font-family:'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor:pointer;
    transition: filter 0.15s ease, transform 0.15s ease;
  }
  .scan-trigger:hover{ filter: brightness(1.08); }
  .scan-trigger:active{ transform: scale(0.985); }
  .scan-trigger:disabled{
    opacity:0.35; cursor:not-allowed; filter:none;
  }

  .ping{
    position:relative;
    width:16px; height:16px;
    border: 2px solid #04101c;
    border-radius:50%;
    flex-shrink:0;
  }
  .ping.active::before{
    content:"";
    position:absolute; inset:-2px;
    border-radius:50%;
    border: 2px solid #04101c;
    animation: ping 1.1s cubic-bezier(0,0,0.3,1) infinite;
  }
  @keyframes ping{
    0%{ transform: scale(1); opacity:0.8; }
    100%{ transform: scale(2.4); opacity:0; }
  }

  .divider{
    display:flex; align-items:center; gap:12px;
    margin: 22px 0;
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }
  .divider::before, .divider::after{
    content:""; flex:1; height:1px;
    background: var(--line);
  }

  .field{
    position:relative;
  }
  .field label{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    margin-bottom: 8px;
    letter-spacing: 0.04em;
  }
  input[type="text"]{
    width:100%;
    background: var(--bg);
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    padding: 13px 14px;
    font-family:'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text);
    outline:none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input[type="text"]::placeholder{ color: #3d4a5f; }
  input[type="text"]:focus{
    border-color: var(--cyan);
    box-shadow: 0 0 0 3px rgba(79,216,255,0.12);
  }

  .status{
    margin-top: 20px;
    padding: 12px 14px;
    border-radius: var(--radius);
    border-left: 3px solid transparent;
    background: rgba(255,255,255,0.02);
    font-family:'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.5;
    display:none;
    word-wrap: break-word;
  }
  .status.show{ display:block; }
  .status-success{ border-color: var(--green); color: var(--green); }
  .status-error{ border-color: var(--red); color: var(--red); }
  .status-info{ border-color: var(--cyan); color: var(--cyan); }
  .status-loading{ border-color: var(--text-dim); color: var(--text-dim); }

  @media (prefers-reduced-motion: reduce){
    .ping.active::before{ animation: none; }
  }

  /* ---- login ---- */
  .hidden{ display:none !important; }

  .login-field{ margin-bottom: 16px; }

  .login-btn{
    width:100%;
    background: transparent;
    color: var(--cyan);
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    padding: 13px;
    font-family:'Space Grotesk', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor:pointer;
    margin-top: 6px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .login-btn:hover{ border-color: var(--cyan); background: rgba(79,216,255,0.06); }

  .login-error{
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--red);
    margin-top: 12px;
    display:none;
  }
  .login-error.show{ display:block; }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 18px;
  }
  .logout-link{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    background:none;
    border:none;
    cursor:pointer;
    letter-spacing: 0.04em;
    padding: 0;
  }
  .logout-link:hover{ color: var(--red); }
</style>
</head>
<body>

  <!-- LAYAR LOGIN ADMIN -->
  <div class="panel" id="loginPanel">
    <span class="corner-tl"></span><span class="corner-br"></span>

    <div class="eyebrow">
      <span class="dot on"></span>
      <span>akses admin diperlukan</span>
    </div>

    <h1>Masuk</h1>
    <p class="sub">Login sebagai admin untuk membuka panel presensi.</p>

    <div class="login-field">
      <label for="loginUser" style="display:block; font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--text-dim); margin-bottom:8px; letter-spacing:0.04em;">Username</label>
      <input type="text" id="loginUser" placeholder="admin" autocomplete="off">
    </div>
    <div class="login-field">
      <label for="loginPass" style="display:block; font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--text-dim); margin-bottom:8px; letter-spacing:0.04em;">Password</label>
      <input type="password" id="loginPass" placeholder="••••••">
    </div>

    <button class="login-btn" onclick="cobaLogin()">Masuk</button>
    <div class="login-error" id="loginError">Username atau password salah.</div>
  </div>

  <!-- PANEL PRESENSI (tersembunyi sampai login) -->
  <div class="panel hidden" id="presensiPanel">
    <span class="corner-tl"></span><span class="corner-br"></span>

    <div class="topbar">
      <div class="eyebrow" style="margin-bottom:0;">
        <span class="dot" id="nfcDot"></span>
        <span id="nfcLabel">memeriksa dukungan NFC…</span>
      </div>
      <button class="logout-link" onclick="logout()">keluar</button>
    </div>

    <h1>Presensi</h1>
    <p class="sub">Tap kartu ke perangkat, atau scan / ketik UID di bawah.</p>

    <button id="btnAktifkanNFC" class="scan-trigger" onclick="mulaiScanNFC()">
      <span class="ping" id="pingIcon"></span>
      <span id="btnLabel">Aktifkan Scan NFC</span>
    </button>

    <div class="divider"><span>ATAU USB READER / MANUAL</span></div>

    <div class="field">
      <label for="uidInput">UID Kartu</label>
      <input type="text" id="uidInput" placeholder="Scan kartu atau ketik UID…" autofocus autocomplete="off">
    </div>

    <div id="statusBox" class="status"></div>
  </div>

<script>
  // =========================================================================
  // GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT KAMU
  // =========================================================================
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwB8mbMMn-1HrX3xkMiqKFAi8TfWBfb3fIDQ5pF3FveQDXSlp_-ZnSirHOlsvukygUX/exec";

  // =========================================================================
  // LOGIN ADMIN (kredensial sederhana, hanya cocok untuk penggunaan internal)
  // =========================================================================
  const ADMIN_USER = "admin";
  const ADMIN_PASS = "1234";

  function cobaLogin() {
    const user = document.getElementById('loginUser').value.trim();
    const pass = document.getElementById('loginPass').value;
    const errorBox = document.getElementById('loginError');

    if (user === ADMIN_USER && pass === ADMIN_PASS) {
      errorBox.classList.remove('show');
      document.getElementById('loginPanel').classList.add('hidden');
      document.getElementById('presensiPanel').classList.remove('hidden');
      initNFC();
    } else {
      errorBox.classList.add('show');
      document.getElementById('loginPass').value = '';
    }
  }

  function logout() {
    document.getElementById('presensiPanel').classList.add('hidden');
    document.getElementById('loginPanel').classList.remove('hidden');
    document.getElementById('loginUser').value = '';
    document.getElementById('loginPass').value = '';
    document.getElementById('loginError').classList.remove('show');
  }

  document.getElementById('loginPass').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') cobaLogin();
  });
  document.getElementById('loginUser').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') cobaLogin();
  });

  let ndefReader = null;

  function initNFC() {
    const dot = document.getElementById('nfcDot');
    const label = document.getElementById('nfcLabel');
    const btn = document.getElementById('btnAktifkanNFC');

    if ('NDEFReader' in window) {
      dot.classList.add('on');
      label.textContent = 'Web NFC didukung';
    } else {
      label.textContent = 'Web NFC tidak didukung — gunakan Chrome Android';
      btn.style.display = 'none';
    }
  };

  // 1. FUNGSI UNTUK WEB NFC (HP ANDROID)
  async function mulaiScanNFC() {
    if ('NDEFReader' in window) {
      try {
        ndefReader = new NDEFReader();
        await ndefReader.scan();

        document.getElementById('nfcDot').classList.add('on');
        document.getElementById('nfcLabel').textContent = 'Menunggu tap kartu…';
        document.getElementById('pingIcon').classList.add('active');
        document.getElementById('btnLabel').textContent = 'Mendengarkan Kartu…';
        document.getElementById('btnAktifkanNFC').disabled = true;

        tampilkanStatus('Sensor NFC aktif. Dekatkan kartu ke belakang HP.', 'info');

        ndefReader.addEventListener('readingerror', () => {
          tampilkanStatus('Gagal membaca tag NFC. Coba dekatkan ulang.', 'error');
        });

        ndefReader.addEventListener('reading', ({ serialNumber }) => {
          if (serialNumber) {
            let formattedUID = serialNumber.replace(/:/g, '').toUpperCase();
            tampilkanStatus('Kartu terdeteksi — UID: ' + formattedUID, 'info');
            kirimPresensi(formattedUID);
          } else {
            tampilkanStatus('Gagal mendapatkan UID kartu.', 'error');
          }
        });

      } catch (error) {
        tampilkanStatus('Gagal mengaktifkan NFC: ' + error.message, 'error');
      }
    } else {
      tampilkanStatus('Web NFC hanya didukung di Google Chrome Android.', 'error');
    }
  }

  // 2. EVENT LISTENER UNTUK USB RFID READER / INPUT MANUAL
  document.getElementById('uidInput').addEventListener('change', function() {
    let uid = this.value.trim();
    if (uid) {
      kirimPresensi(uid);
    }
  });

  // 3. FUNGSI UTAMA KIRIM DATA KE GOOGLE APPS SCRIPT
  function kirimPresensi(uid) {
    tampilkanStatus('Memproses presensi…', 'loading');

    let targetUrl = `${APPS_SCRIPT_URL}?action=presensi&uid=${encodeURIComponent(uid)}`;

    fetch(targetUrl)
      .then(response => response.json())
      .then(data => {
        if (data.status === 'success') {
          tampilkanStatus(data.message, 'success');
        } else {
          tampilkanStatus(data.message, 'error');
        }
        let input = document.getElementById('uidInput');
        input.value = '';
        input.focus();
      })
      .catch(err => {
        tampilkanStatus('Gagal terhubung ke server Apps Script.', 'error');
      });
  }

  function tampilkanStatus(pesan, tipe) {
    let box = document.getElementById('statusBox');
    box.classList.add('show');
    box.className = 'status show status-' + tipe;
    box.innerHTML = pesan;
  }
</script>
</body>
</html>
